name: Release IBM CSI Host Definer

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile-csi-host-definer'
      - 'controllers/**'
      - 'common/**'
      - 'LICENSE'

  workflow_dispatch:
    inputs:
      dockerfile:
        description: 'Dockerfile to build'
        required: true
        default: 'Dockerfile-csi-host-definer'
      context:
        description: 'Context for the Docker build'
        required: true
        default: '.'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tmp-ibm-block-csi-driver-host-definer
  IMAGE_TAG: latest
  DOCKERFILE: ${{ github.event.inputs.dockerfile || 'Dockerfile-csi-host-definer' }}
  BUILD_CONTEXT: ${{ github.event.inputs.context || '.' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          REGISTRY_FULL_PATH=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_FULL_PATH=$REGISTRY_FULL_PATH" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push host definer image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.REGISTRY_FULL_PATH }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_FULL_PATH }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=tmp-${{ github.run_number }}
            BUILD_NUMBER=${{ github.run_number }}
